<!DOCTYPE html>
<html lang="pt-br">

<head>

    <script src="./app.js" defer type="module"></script>

    <title>Contatos</title>
</head>

<body>
        <div class = "titulo"> Realizar Cadastro </div>
    <header class="container">

        <div class="bloco">

                <input type="text" id="nome" required>

            </div>

            <div class="inputbox">
                <input type="text" id="celular" required>
                <label for="celular">Celular</label>
            </div>

            <div class="inputbox">
                <input type="text" id="email" required>
                <label for="email">Email</label>
            </div>

            <div class="inputbox">
                <input type="text" id="endereco" required>
                <label for="endereco">Endereço</label>
            </div>

            <div class="inputbox">
                <input type="text" id="cidade" required>
                <label for="cidade">Cidade</label>
            </div>

            <div class="inputbox">
                <input type="text" id="foto">
                <label for="Imagem">Url Imagem</label>
            </div>

        </div>

        <div class="row">
            <button id="btn">Salvar</button>
        </div>

        <hr>

    </header>

    <main>

        <div class="tabela" id="tabela">

            <!-- cabeçalho -->
            <div class="header">ID</div>
            <div class="header">Nome</div>
            <div class="header">Email</div>
            <div class="header">Cidade</div>
            <div class="header">Telefone</div>
            <div class="header">Ações</div>

        </div>

    </main>

    <footer></footer>
